project:
  type: website
  output-dir: docs        # generated website folder used for publishing
  execute-dir: project

# Publish these source folders to docs/ so linked files work online
resources:
  - data/**
  - images/**
  - resume/**
  - files/**              # presentation PDFs and downloadable documents
  - videos/**             # project demonstration videos

website:
  title: "Hien Bui"
  site-url: "https://hienbui0393.github.io"  # public portfolio URL
  search: true
  page-navigation: true
  navbar:
    background: "#2C3E50"   # dark blue
    foreground: light        # white text/icons
    left:
      - text: Home
        href: index.qmd
      - text: Resume
        href: resume.qmd
      - text: Projects
        menu:
          - text: Predicting Emergency Department Demand
            href: projects/predicting-emergency-department-demand.qmd
          - text: TMDB Movie Recommender
            href: projects/movie-recommender.qmd
          - text: EV Adoption in WA
            href: projects/ev-adoption.qmd
          - text: Manga Sentiment
            href: projects/manga-sentiment.qmd
          - text: Book Ratings
            href: projects/book-ratings.qmd
          - text: Luxury Car Price
            href: projects/luxury-car-price.qmd  # include extension for reliable rendering
          - text: Object Detection
            href: projects/object-detection.qmd
      - text: Contact
        href: contact.qmd
    right:
      - icon: envelope
        href: "mailto:hien.bui0393@gmail.com"
        aria-label: "Email"
      - icon: linkedin
        href: "https://www.linkedin.com/in/hien-bui-6273b010a/"
        aria-label: "LinkedIn"
      - icon: github
        href: "https://github.com/hienbui0393"  # current GitHub profile
        aria-label: "GitHub"

format:
  html:
    theme: flatly
    toc: true
    toc-depth: 2
    link-external-newwindow: true
    smooth-scroll: true
    code-fold: false
    code-copy: true
    code-overflow: wrap
    css: styles.css          # site-wide CSS (TOC + buttons color)

# Show code, don't execute, suppress messages
execute:
  eval: false
  echo: true
  warning: false
  error: false
